name: Release

# `npm run release` (lerna version) bumps every package, commits, and pushes a
# v* tag. This workflow then publishes each public package whose version is
# not on npm yet.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check tag matches lerna.json version
        run: |
          LERNA_VERSION="v$(node -p "require('./lerna.json').version")"
          if [ "$GITHUB_REF_NAME" != "$LERNA_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match lerna.json version $LERNA_VERSION"
            exit 1
          fi

      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npx lerna publish from-package --yes
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
