name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # Lerna 10 needs Node 22.22+, so the checks call the workspace scripts
      # through npm and run on every supported Node version.
      - run: npm ci
      - name: Type-check
        run: npm run typecheck --workspaces --if-present
      - name: Lint
        run: npm run lint --workspaces --if-present
      - name: Test
        run: npm test --workspaces --if-present
      - name: Build
        run: npm run build --workspaces --if-present
